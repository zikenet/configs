# --------------------------------------------------------------------------
# Status line customisation
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#ABB2BF,bg=default]#[fg=black,bg=#ABB2BF,bold] #(echo #{session_name} | tr '[:lower:]' '[:upper:]') #[fg=#ABB2BF,bg=#828ca0]#[fg=#828ca0,bg=default] "
set -g status-right "#[fg=#ABB2BF]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack] #{p:pane_current_command} ❘ #[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W#{?window_zoomed_flag,ʺ} "
set -g window-status-current-format "#[fg=#828CA0,bg=default]█#[fg=black,bg=#828CA0,bold]#I#[bg=#ABB2BF,fg=#828CA0]█#[fg=black,bg=#ABB2BF] #W#[fg=#ABB2BF,bg=default]█"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=#ABB2BF"
set -g message-style "bg=default,fg=#ABB2BF"
set -g message-command-style "bg=default,fg=#ABB2BF"
set -g mode-style "bg=#ABB2BF,fg=black"
setw -g clock-mode-colour "#ABB2BF"
